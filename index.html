<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer</title>
  <meta name="description" content="Discover trending and popular movies, search the catalog, and save favorites — a vanilla JavaScript movie explorer built on the TMDB API.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark.css">
</head>
<body data-page="home">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="7" y1="4" x2="7" y2="20"></line><line x1="17" y1="4" x2="17" y2="20"></line><line x1="2" y1="9" x2="7" y2="9"></line><line x1="2" y1="15" x2="7" y2="15"></line><line x1="17" y1="9" x2="22" y2="9"></line><line x1="17" y1="15" x2="22" y2="15"></line></svg>
        <span>Movie Explorer</span>
      </a>
      <div class="header-search">
        <form id="searchForm" class="search-box" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search movies..." aria-label="Search movies">
        </form>
      </div>
      <nav class="header-nav">
        <a href="favorites.html" class="nav-link">Favorites</a>
        <button class="icon-btn theme-toggle" aria-label="Switch to dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </nav>
    </div>
  </header>
  <div class="filmstrip-edge"></div>

  <main class="main">
    <section class="trending-section" id="trendingSection">
      <h2>Trending this week</h2>
      <div class="movie-grid movie-grid-compact" id="trendingGrid"></div>
    </section>

    <h2 class="results-heading" id="resultsHeading">Popular movies</h2>
    <div class="movie-grid" id="movieGrid"></div>

    <div class="load-more-wrap">
      <button class="btn btn-secondary" id="loadMoreBtn" hidden>Load more</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p>Movie Explorer — built with vanilla JavaScript, HTML &amp; CSS.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
